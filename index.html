<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Enclave Hub" />
  <meta name="theme-color" content="#0b0e17" />
  <title>ENCLAVE NETWORK // MetroTV • PUNT • KnokNox</title>

  <!-- Shortcut / Home Screen App Icons (Dynamically synced from LOGO_CONFIG on load) -->
  <link id="dynamic-favicon" rel="icon" type="image/png" href="https://api.dicebear.com/7.x/shapes/svg?seed=EnclaveHub" />
  <link id="dynamic-touch-icon" rel="apple-touch-icon" href="https://api.dicebear.com/7.x/shapes/svg?seed=EnclaveHub" />

  <style>
    :root {
      --bg-deep: #07090f;
      --bg-panel: #101420;
      --bg-card: #161c2e;
      --bg-input: #0c101b;
      --border: #252f4a;
      --text-main: #f0f4ff;
      --text-muted: #8e9cc0;
      --enclave-gold: #f5b041;
      --metro-red: #ff2a4b;
      --punt-green: #53fc18;
      --knok-cyan: #00f2fe;
      --knok-pink: #fe0979;
      --danger: #ff4757;
      --success: #2ed573;
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      min-width: 0; /* Prevents flex/grid text spillover */
      word-wrap: break-word;
      overflow-wrap: break-word;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at top, #151c33 0%, #05070c 100%);
      color: var(--text-main);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
    }

    /* Custom Scrollbars */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.2); }
    ::-webkit-scrollbar-thumb { background: #2d3a5e; border-radius: 999px; }
    ::-webkit-scrollbar-thumb:hover { background: #43558a; }

    /* Viewport Shell: Switches cleanly between Desktop Landscape & Mobile Portrait */
    .viewport-wrapper {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      transition: all 0.25s ease;
    }

    .app-shell {
      width: 100%;
      height: 100%;
      background: var(--bg-deep);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    /* Mobile Portrait Mode Frame */
    .viewport-wrapper.mode-mobile {
      padding: 12px;
      background: #020306;
    }
    .viewport-wrapper.mode-mobile .app-shell {
      width: 100%;
      max-width: 430px;
      height: 94vh;
      max-height: 900px;
      border-radius: 34px;
      border: 6px solid #222a42;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.85), 0 0 0 2px #0e1320;
    }

    /* Top Header Bar */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 16px;
      background: rgba(16, 20, 32, 0.95);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      z-index: 20;
    }

    .brand-cluster {
      display: flex;
      align-items: center;
      gap: 10px;
      overflow: hidden;
    }

    .brand-logo {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      object-fit: cover;
      border: 1px solid rgba(255, 255, 255, 0.18);
      flex-shrink: 0;
      background: #1a2138;
    }

    .brand-title {
      font-weight: 800;
      font-size: 0.95rem;
      letter-spacing: 0.6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .brand-sub {
      font-size: 0.7rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .top-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .mode-switch-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #1b233b;
      color: var(--text-main);
      border: 1px solid #32416d;
      padding: 6px 11px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
      white-space: nowrap;
    }
    .mode-switch-btn:hover {
      background: #263254;
      border-color: var(--knok-cyan);
    }

    /* Main Workspace Layout */
    .workspace {
      flex: 1;
      display: flex;
      overflow: hidden;
      position: relative;
    }

    /* Navigation Rail (Sidebar in Desktop, Bottom Bar in Mobile) */
    .nav-rail {
      width: 230px;
      background: var(--bg-panel);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 12px;
      gap: 6px;
      flex-shrink: 0;
      overflow-y: auto;
    }

    .viewport-wrapper.mode-mobile .workspace {
      flex-direction: column;
    }
    .viewport-wrapper.mode-mobile .nav-rail {
      width: 100%;
      height: auto;
      order: 2;
      flex-direction: row;
      justify-content: space-around;
      padding: 6px 8px;
      border-right: none;
      border-top: 1px solid var(--border);
      overflow-x: auto;
      overflow-y: hidden;
    }

    .nav-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 10px 12px;
      border-radius: 11px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-muted);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      text-align: left;
      transition: 0.18s;
    }
    .nav-btn img {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      object-fit: cover;
      flex-shrink: 0;
    }
    .nav-btn:hover {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-main);
    }
    .nav-btn.active {
      background: #1d2642;
      color: #fff;
      border-color: #3b4e85;
    }
    .nav-btn.metro-tab.active { border-color: var(--metro-red); box-shadow: inset 3px 0 0 var(--metro-red); }
    .nav-btn.punt-tab.active { border-color: var(--punt-green); box-shadow: inset 3px 0 0 var(--punt-green); }
    .nav-btn.knok-tab.active { border-color: var(--knok-cyan); box-shadow: inset 3px 0 0 var(--knok-cyan); }
    .nav-btn.admin-tab { color: var(--enclave-gold); border: 1px dashed rgba(245, 176, 65, 0.4); }
    .nav-btn.admin-tab.active { background: rgba(245, 176, 65, 0.15); border-color: var(--enclave-gold); }

    .viewport-wrapper.mode-mobile .nav-btn {
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 6px 8px;
      gap: 4px;
      font-size: 0.68rem;
      width: auto;
      min-width: 58px;
      text-align: center;
    }

    /* Main Scrollable Content Area */
    .main-stage {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .viewport-wrapper.mode-mobile .main-stage {
      padding: 12px;
    }

    /* Generic Cards & Containers */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 14px;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
    }

    /* Typography & Badges */
    h1, h2, h3, h4 {
      line-height: 1.25;
      word-break: break-word;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 700;
      background: #232d4b;
      color: #dbe4ff;
      white-space: nowrap;
    }
    .badge.verified {
      background: rgba(0, 242, 254, 0.16);
      color: var(--knok-cyan);
      border: 1px solid rgba(0, 242, 254, 0.4);
    }
    .badge.tier {
      background: rgba(245, 176, 65, 0.16);
      color: var(--enclave-gold);
      border: 1px solid rgba(245, 176, 65, 0.4);
    }
    .badge.metro { background: rgba(255, 42, 75, 0.2); color: #ff6b81; border: 1px solid var(--metro-red); }
    .badge.punt { background: rgba(83, 252, 24, 0.15); color: var(--punt-green); border: 1px solid var(--punt-green); }
    .badge.knoknox { background: rgba(254, 9, 121, 0.2); color: #ff79b0; border: 1px solid var(--knok-pink); }

    /* Form Controls */
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 12px;
    }
    .form-group label {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-muted);
    }
    input[type="text"],
    input[type="password"],
    input[type="number"],
    input[type="url"],
    select,
    textarea {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 0.88rem;
      outline: none;
    }
    textarea {
      resize: vertical;
      min-height: 76px;
    }
    input:focus, select:focus, textarea:focus {
      border-color: var(--knok-cyan);
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 9px 14px;
      border-radius: 10px;
      border: 1px solid transparent;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      transition: 0.18s;
      white-space: nowrap;
    }
    .btn-primary { background: linear-gradient(135deg, #2b58ff, #00d2ff); color: #fff; }
    .btn-metro { background: var(--metro-red); color: #fff; }
    .btn-punt { background: var(--punt-green); color: #051b00; }
    .btn-knok { background: linear-gradient(135deg, var(--knok-pink), var(--knok-cyan)); color: #fff; }
    .btn-outline { background: #1a2238; color: var(--text-main); border-color: #313f66; }
    .btn-outline:hover { border-color: #5973b8; }
    .btn-danger { background: rgba(255, 71, 87, 0.18); color: #ff6b81; border-color: var(--danger); }
    .btn-success { background: rgba(46, 213, 115, 0.18); color: var(--success); border-color: var(--success); }
    .btn-sm { padding: 5px 10px; font-size: 0.74rem; border-radius: 8px; }

    /* Auth Screen */
    .auth-container {
      max-width: 460px;
      width: 100%;
      margin: auto;
    }

    /* Post Card */
    .post-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .post-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }
    .post-author {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }
    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #33436e;
      flex-shrink: 0;
      background: #0d1220;
    }
    .avatar-lg {
      width: 74px;
      height: 74px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--knok-cyan);
      flex-shrink: 0;
    }
    .post-caption {
      font-size: 0.92rem;
      line-height: 1.48;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .post-media-box {
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      background: #05070d;
      border: 1px solid #222b45;
      display: flex;
      align-items: center;
      justify-content: center;
      max-height: 480px;
    }
    .post-media-box img,
    .post-media-box video {
      width: 100%;
      max-height: 460px;
      object-fit: contain;
      display: block;
    }
    .post-media-box audio {
      width: 100%;
      margin: 14px;
    }
    .post-actions {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      padding-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.07);
    }

    /* Shared Post Embed Box */
    .shared-embed {
      background: rgba(11, 15, 26, 0.75);
      border-left: 3px solid var(--knok-cyan);
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.82rem;
    }

    /* Chat Layout */
    .chat-layout {
      display: grid;
      grid-template-columns: 260px 1fr;
      gap: 14px;
      min-height: 500px;
    }
    .viewport-wrapper.mode-mobile .chat-layout {
      grid-template-columns: 1fr;
    }
    .chat-messages {
      height: 360px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 12px;
      background: var(--bg-input);
      border-radius: 12px;
      border: 1px solid var(--border);
    }
    .msg-bubble {
      max-width: 82%;
      padding: 9px 12px;
      border-radius: 12px;
      background: #1d2744;
      align-self: flex-start;
      font-size: 0.85rem;
    }
    .msg-bubble.mine {
      background: #1b4965;
      align-self: flex-end;
    }
    .reply-quote {
      font-size: 0.74rem;
      padding: 4px 8px;
      margin-bottom: 6px;
      border-left: 2px solid var(--enclave-gold);
      background: rgba(0, 0, 0, 0.25);
      border-radius: 4px;
      color: var(--text-muted);
    }

    /* Modal Overlay */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(3, 5, 10, 0.82);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 999;
    }
    .modal-backdrop.open {
      display: flex;
    }
    .modal-box {
      background: var(--bg-panel);
      border: 1px solid #384978;
      border-radius: 16px;
      max-width: 600px;
      width: 100%;
      max-height: 86vh;
      overflow-y: auto;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #1b2540;
      color: #fff;
      border: 1px solid var(--knok-cyan);
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 0.83rem;
      font-weight: 600;
      z-index: 1200;
      display: none;
      box-shadow: 0 10px 25px rgba(0,0,0,0.6);
    }
  </style>
</head>

const PLATFORM_SPECS = {

let STATE = {

  currentUser: null,
  users: [],

function calculateTierInfo(followersCount) {
  const f = Math.max(0, Number(followersCount) || 0);
  if (f <= 50) return { tier: 1, multiplier: 1.0, verified: false, label: 'Tier 1 (1x)' };
  if (f <= 200) return { tier: 2, multiplier: 1.5, verified: true, label: 'Tier 2 (1.5x)' };
  if (f <= 500) return { tier: 3, multiplier: 2.0, verified: true, label: 'Tier 3 (2x)' };
  if (f <= 1000) return { tier: 4, multiplier: 2.5, verified: true, label: 'Tier 4 (2.5x)' };
  if (f <= 5000) return { tier: 5, multiplier: 3.0, verified: true, label: 'Tier 5 (3x)' };
  if (f <= 10000) return { tier: 6, multiplier: 3.5, verified: true, label: 'Tier 6 (3.5x)' };
  if (f <= 100000) return { tier: 7, multiplier: 4.0, verified: true, label: 'Tier 7 (4x)' };
  if (f <= 1000000) return { tier: 8, multiplier: 4.5, verified: true, label: 'Tier 8 (4.5x)' };
  if (f <= 10000000) return { tier: 9, multiplier: 5.0, verified: true, label: 'Tier 9 (5x)' };
  if (f <= 100000000) return { tier: 10, multiplier: 5.5, verified: true, label: 'Tier 10 (5.5x)' };
  return { tier: 11, multiplier: 6.0, verified: true, label: 'Tier 11 (6x)' };
}

window.addEventListener('DOMContentLoaded', () => {
  applyLogos();
  applyViewportMode(STATE.viewportMode);
  initLocalDemoDatabaseIfNeeded();

  const savedSessionUser = localStorage.getItem('enclave_session_user');
  if (savedSessionUser) {
    apiCall({ action: 'getBootstrap', username: savedSessionUser }).then(res => {
      if (res && res.ok && res.currentUser) {
        ingestBootstrap(res);
      } else {
        localStorage.removeItem('enclave_session_user');
        render();
      }
    });
  } else {
    render();
  }
});

function applyLogos() {
  const hubLogo = LOGO_CONFIG.ENCLAVE_HUB_LOGO;
  document.getElementById('cornerHubLogo').src = hubLogo;
  document.getElementById('dynamic-favicon').href = hubLogo;
  document.getElementById('dynamic-touch-icon').href = hubLogo;
  document.getElementById('navMetroLogo').src = LOGO_CONFIG.METRO_TV_LOGO;
  document.getElementById('navPuntLogo').src = LOGO_CONFIG.PUNT_LOGO;
  document.getElementById('navKnokLogo').src = LOGO_CONFIG.KNOKNOX_LOGO;
}

function toggleViewportMode() {
  const next = STATE.viewportMode === 'desktop' ? 'mobile' : 'desktop';
  applyViewportMode(next);
}

function applyViewportMode(mode) {
  STATE.viewportMode = mode;
  localStorage.setItem('enclave_viewport_mode', mode);
  const wrapper = document.getElementById('viewportWrapper');
  const btn = document.getElementById('viewportToggleBtn');
  if (mode === 'mobile') {
    wrapper.classList.remove('mode-desktop');
    wrapper.classList.add('mode-mobile');
    btn.innerHTML = '🖥️ Switch to Desktop (Landscape)';
  } else {
    wrapper.classList.remove('mode-mobile');
    wrapper.classList.add('mode-desktop');
    btn.innerHTML = '📱 Switch to Mobile (Portrait)';
  }
}

/**
 * ============================================================================
 * 4. API DISPATCHER (Google Sheets Web App + Local Fallback Engine)
 * ============================================================================
 */
async function apiCall(payload) {
  const scriptUrl = (LOGO_CONFIG.GOOGLE_SCRIPT_URL || localStorage.getItem('enclave_custom_gas_url') || '').trim();
  if (scriptUrl) {
    try {
      const response = await fetch(scriptUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });
      return await response.json();
    } catch (err) {
      showToast('Google Script network error: ' + err.message);
      return { ok: false, error: err.message };
    }
  }
  return localDatabaseEngine(payload);
}

function ingestBootstrap(res) {
  STATE.currentUser = res.currentUser;
  STATE.users = res.users || [];
  STATE.posts = res.posts || [];
  STATE.connections = res.connections || [];
  STATE.blocks = res.blocks || [];
  STATE.groups = res.groups || [];
  STATE.messages = res.messages || [];
  STATE.reports = res.reports || [];
  STATE.history = res.history || [];

  if (res.globalAdminLogo) {
    document.getElementById('cornerHubLogo').src = res.globalAdminLogo;
  }

  localStorage.setItem('enclave_session_user', STATE.currentUser.username);
  document.getElementById('navRail').style.display = 'flex';
  document.getElementById('syncBtn').style.display = 'inline-flex';
  document.getElementById('logoutBtn').style.display = 'inline-flex';
  document.getElementById('navAdminBtn').style.display = STATE.currentUser.isAdmin ? 'flex' : 'none';

  render();
}

async function refreshFromServer() {
  if (!STATE.currentUser) return;
  const res = await apiCall({ action: 'getBootstrap', username: STATE.currentUser.username });
  if (res.ok) {
    ingestBootstrap(res);
    showToast('Synced latest state.');
  }
}

function logout() {
  localStorage.removeItem('enclave_session_user');
  STATE.currentUser = null;
  document.getElementById('navRail').style.display = 'none';
  document.getElementById('syncBtn').style.display = 'none';
  document.getElementById('logoutBtn').style.display = 'none';
  render();
}

function navigate(page) {
  STATE.currentPage = page;
  STATE.pendingMedia = { dataUrl: '', mediaType: 'none', durationSec: 0, resolution: 'Standard' };
  document.querySelectorAll('.nav-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.page === page);
  });
  render();
}

/**
 * ============================================================================
 * 5. CLIENT-SIDE MEDIA INSPECTOR (Enforces 10m MetroTV / 5m PUNT / 1m KnokNox)
 * ============================================================================
 */
function handleMediaFileSelect(inputEl, platformKey) {
  const file = inputEl.files && inputEl.files[0];
  const statusEl = document.getElementById('mediaCheckStatus');
  if (!file) return;

  const spec = PLATFORM_SPECS[platformKey];
  const reader = new FileReader();

  if (file.type.startsWith('image/')) {
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        STATE.pendingMedia = {
          dataUrl: e.target.result,
          mediaType: 'image',
          durationSec: 0,
          resolution: img.width + '×' + img.height + 'px'
        };
        if (statusEl) {
          statusEl.innerHTML = `<span style="color:var(--success);">✓ Image Ready (${STATE.pendingMedia.resolution})</span>`;
        }
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  } else if (file.type.startsWith('video/') || file.type.startsWith('audio/')) {
    const isVideo = file.type.startsWith('video/');
    const tempUrl = URL.createObjectURL(file);
    const mediaEl = document.createElement(isVideo ? 'video' : 'audio');
    mediaEl.preload = 'metadata';

    mediaEl.onloadedmetadata = () => {
      const dur = Math.round(mediaEl.duration || 0);
      const res = isVideo ? (mediaEl.videoWidth + '×' + mediaEl.videoHeight + 'px') : 'MP3/Audio Stream';
      URL.revokeObjectURL(tempUrl);

      if (dur > spec.maxDurationSec) {
        STATE.pendingMedia = { dataUrl: '', mediaType: 'none', durationSec: 0, resolution: '' };
        inputEl.value = '';
        if (statusEl) {
          statusEl.innerHTML = `<span style="color:var(--danger);">✕ Rejected: Duration is ${dur}s. ${spec.name} max is ${spec.maxDurationSec}s (${spec.maxDurationSec/60} min).</span>`;
        }
        showToast(`${spec.name} limit exceeded! Max ${spec.maxDurationSec / 60} min.`);
        return;
      }

      reader.onload = ev => {
        STATE.pendingMedia = {
          dataUrl: ev.target.result,
          mediaType: isVideo ? 'video' : 'audio',
          durationSec: dur,
          resolution: res
        };
        if (statusEl) {
          statusEl.innerHTML = `<span style="color:var(--success);">✓ ${isVideo ? 'Video' : 'Audio'} Verified (${dur}s • ${res})</span>`;
        }
      };
      reader.readAsDataURL(file);
    };
    mediaEl.src = tempUrl;
  }
}

/**
 * ============================================================================
 * 6. VIEW RENDERERS
 * ============================================================================
 */
function render() {
  const stage = document.getElementById('mainStage');
  if (!STATE.currentUser) {
    stage.innerHTML = renderAuthView();
    return;
  }

  switch (STATE.currentPage) {
    case 'profile': stage.innerHTML = renderProfileView(); break;
    case 'metrotv': stage.innerHTML = renderPlatformView('METROTV'); break;
    case 'punt': stage.innerHTML = renderPlatformView('PUNT'); break;
    case 'knoknox': stage.innerHTML = renderPlatformView('KNOKNOX'); break;
    case 'search': stage.innerHTML = renderSearchView(); break;
    case 'connections': stage.innerHTML = renderConnectionsView(); break;
    case 'admin': stage.innerHTML = STATE.currentUser.isAdmin ? renderAdminView() : renderProfileView(); break;
    default: stage.innerHTML = renderProfileView();
  }
}

async function submitLogin(e) {
  e.preventDefault();
  const username = document.getElementById('loginUsername').value.trim();
  const password = document.getElementById('loginPassword').value.trim();
  const res = await apiCall({ action: 'login', username, password });
  if (!res.ok) return showToast(res.error || 'Login failed');
  ingestBootstrap(res);
}

async function submitSignup(e) {
  e.preventDefault();
  const username = document.getElementById('signupUsername').value.trim();
  const displayName = document.getElementById('signupDisplayName').value.trim();
  const password = document.getElementById('signupPassword').value.trim();
  const initialFollowers = Number(document.getElementById('signupFollowers').value || 10);
  const urlInput = document.getElementById('signupPicUrl').value.trim();
  const fileInput = document.getElementById('signupPicFile');

  let profilePic = urlInput;
  if (fileInput.files && fileInput.files[0]) {
    profilePic = await fileToDataUrl(fileInput.files[0]);
  }

  const res = await apiCall({
    action: 'signup',
    username,
    displayName,
    password,
    initialFollowers,
    profilePic
  });
  if (!res.ok) return showToast(res.error || 'Sign up failed');
  ingestBootstrap(res);
}

async function saveProfileChanges() {
  const displayName = document.getElementById('editDisplayName').value.trim();
  const avatarInput = document.getElementById('editAvatarFile');
  const adminLogoInput = document.getElementById('editAdminLogoFile');

  let profilePic = '';
  let adminLogo = '';
  if (avatarInput && avatarInput.files && avatarInput.files[0]) {
    profilePic = await fileToDataUrl(avatarInput.files[0]);
  }
  if (adminLogoInput && adminLogoInput.files && adminLogoInput.files[0]) {
    adminLogo = await fileToDataUrl(adminLogoInput.files[0]);
  }

  const res = await apiCall({
    action: 'updateProfile',
    username: STATE.currentUser.username,
    displayName,
    profilePic,
    adminLogo
  });
  if (!res.ok) return showToast(res.error);
  ingestBootstrap(res);
  showToast('Profile updated!');
}

async function togglePlatformActivator(platformKey) {
  const res = await apiCall({
    action: 'togglePlatform',
    username: STATE.currentUser.username,
    platform: platformKey
  });
  if (!res.ok) return showToast(res.error);
  ingestBootstrap(res);
}

async function submitPlatformPost(e, platformKey) {
  e.preventDefault();
  const caption = document.getElementById('postCaptionInput').value.trim();
  const directUrl = document.getElementById('postDirectMediaUrl').value.trim();
  const directType = document.getElementById('postDirectMediaType').value;

  let mediaUrl = STATE.pendingMedia.dataUrl;
  let mediaType = STATE.pendingMedia.mediaType;
  let durationSec = STATE.pendingMedia.durationSec;
  let resolution = STATE.pendingMedia.resolution || PLATFORM_SPECS[platformKey].bestResolution;

  if (!mediaUrl && directUrl) {
    mediaUrl = directUrl;
    mediaType = directType;
  }

  const res = await apiCall({
    action: 'createPost',
    author: STATE.currentUser.username,
    platform: platformKey,
    caption,
    mediaUrl,
    mediaType,
    durationSec,
    resolution
  });
  if (!res.ok) return showToast(res.error);
  STATE.pendingMedia = { dataUrl: '', mediaType: 'none', durationSec: 0, resolution: 'Standard' };
  ingestBootstrap(res);
  showToast(`Published on ${PLATFORM_SPECS[platformKey].name}! Generative engagement applied.`);
}

    resolution: orig.resolution,

function getConnectionStatus(me, other) {
  const m = me.toLowerCase();
  const o = other.toLowerCase();
  const isBlocked = STATE.blocks.some(b =>
    (b.blocker.toLowerCase() === m && b.blocked.toLowerCase() === o) ||
    (b.blocker.toLowerCase() === o && b.blocked.toLowerCase() === m)
  );
  if (isBlocked) return 'BLOCKED';
  const conn = STATE.connections.find(c =>
    (c.requester.toLowerCase() === m && c.receiver.toLowerCase() === o) ||
    (c.requester.toLowerCase() === o && c.receiver.toLowerCase() === m)
  );
  if (!conn) return 'NONE';
  if (conn.status === 'ACCEPTED') return 'CONNECTED';
  if (conn.status === 'PENDING') return 'PENDING';
  return 'NONE'; // DENIED allows re-sending!
}

async function sendConnection(receiver) {
  const res = await apiCall({ action: 'sendConnectionRequest', requester: STATE.currentUser.username, receiver });
  if (!res.ok) return showToast(res.error);
  ingestBootstrap(res);
  showToast('Connection request sent to @' + receiver);
}

async function respondConnection(connId, decision) {
  const res = await apiCall({ action: 'respondConnectionRequest', connId, username: STATE.currentUser.username, decision });
  if (!res.ok) return showToast(res.error);
  ingestBootstrap(res);
  showToast('Connection ' + decision.toLowerCase());
}

async function blockUserAction(blocked) {
  const res = await apiCall({ action: 'blockUser', blocker: STATE.currentUser.username, blocked });
  if (!res.ok) return showToast(res.error);
  ingestBootstrap(res);
  showToast('Blocked @' + blocked + '. Only EnclaveAdmin can unblock.');
}

function localDatabaseEngine(req) {
  const db = JSON.parse(localStorage.getItem('enclave_local_db_v1'));
  const save = () => localStorage.setItem('enclave_local_db_v1', JSON.stringify(db));
  const action = req.action;

  if (action === 'signup') {
    if (db.users.some(u => u.username.toLowerCase() === req.username.toLowerCase())) {
      return { ok: false, error: 'Username already taken.' };
    }
    const isAdmin = req.username === 'EnclaveAdmin' && req.password === 'ADMIN_KEY_2026';
    db.users.push({
      username: req.username,
      password: req.password,
      displayName: isAdmin ? 'Enclave Admin' : (req.displayName || req.username),
      profilePic: req.profilePic || ('https://api.dicebear.com/7.x/adventurer/svg?seed=' + encodeURIComponent(req.username)),
      followers: isAdmin ? 250000 : (Number(req.initialFollowers) || 25),
      metroActive: isAdmin,
      puntActive: isAdmin,
      knoknoxActive: isAdmin,
      isAdmin: isAdmin,
      adminLogo: isAdmin ? LOGO_CONFIG.ENCLAVE_HUB_LOGO : '',
      createdAt: new Date().toISOString()
    });
    save();
    return buildLocalBootstrap(db, req.username);
  }

  if (action === 'login') {
    const u = db.users.find(x => x.username.toLowerCase() === req.username.toLowerCase() && x.password === req.password);
    if (!u) return { ok: false, error: 'Invalid username or password.' };
    return buildLocalBootstrap(db, u.username);
  }

  if (action === 'getBootstrap') {
    return buildLocalBootstrap(db, req.username);
  }

  if (action === 'updateProfile') {
    const u = db.users.find(x => x.username.toLowerCase() === req.username.toLowerCase());
    if (!u) return { ok: false, error: 'User not found.' };
    if (req.displayName) u.displayName = req.displayName;
    if (req.profilePic) u.profilePic = req.profilePic;
    if (req.adminLogo && u.isAdmin) u.adminLogo = req.adminLogo;
    save();
    return buildLocalBootstrap(db, u.username);
  }

  if (action === 'togglePlatform') {
    const u = db.users.find(x => x.username.toLowerCase() === req.username.toLowerCase());
    if (!u) return { ok: false, error: 'User not found.' };
    const p = req.platform.toLowerCase();
    if (p === 'metrotv') u.metroActive = !u.metroActive;
    if (p === 'punt') u.puntActive = !u.puntActive;
    if (p === 'knoknox') u.knoknoxActive = !u.knoknoxActive;
    save();
    return buildLocalBootstrap(db, u.username);
  }

  if (action === 'createPost') {
    const u = db.users.find(x => x.username.toLowerCase() === req.author.toLowerCase());
    if (!u) return { ok: false, error: 'Author not found.' };
    const f = Math.max(1, Number(u.followers) || 1);
    const tierInfo = calculateTierInfo(f);
    const base = req.platform === 'KNOKNOX' ? Math.max(f, 25) : Math.max(f, 10);
    const genUp = Math.max(1, Math.round(base * (0.50 + Math.random() * 0.10) * tierInfo.multiplier));
    const genDown = Math.max(0, Math.round(base * (0.01 + Math.random() * 0.09) * tierInfo.multiplier));
    u.followers = Number(u.followers || 0) + Math.max(1, Math.round((genUp - genDown) * 0.12));

    db.posts.unshift({
      postId: 'POST_' + Date.now(),
      author: u.username,
      platform: req.platform,
      caption: req.caption,
      mediaUrl: req.mediaUrl || '',
      mediaType: req.mediaType || 'none',
      durationSec: Number(req.durationSec) || 0,
      resolution: req.resolution || 'Standard',
      genUpvotes: genUp,
      genDownvotes: genDown,
      manualUpvotes: 0,
      manualDownvotes: 0,
      sharedFromId: req.sharedFromId || '',
      sharedFromAuthor: req.sharedFromAuthor || '',
      status: 'ACTIVE',
      takedownReason: '',
      createdAt: new Date().toISOString()
    });
    save();
    return buildLocalBootstrap(db, u.username);
  }

  if (action === 'votePost') {
    const existingIdx = db.votes.findIndex(v => v.postId === req.postId && v.username.toLowerCase() === req.username.toLowerCase());
    if (existingIdx > -1) {
      if (db.votes[existingIdx].voteType === req.voteType) db.votes.splice(existingIdx, 1);
      else db.votes[existingIdx].voteType = req.voteType;
    } else {
      db.votes.push({ postId: req.postId, username: req.username, voteType: req.voteType });
    }
    const p = db.posts.find(x => x.postId === req.postId);
    if (p) {
      const pVotes = db.votes.filter(v => v.postId === req.postId);
      p.manualUpvotes = pVotes.filter(v => v.voteType === 'UP').length;
      p.manualDownvotes = pVotes.filter(v => v.voteType === 'DOWN').length;
    }
    save();
    return buildLocalBootstrap(db, req.username);
  }

  if (action === 'reportPost') {
    const p = db.posts.find(x => x.postId === req.postId);
    if (!p) return { ok: false, error: 'Post not found.' };
    db.reports.push({
      reportId: 'REP_' + Date.now(),
      postId: p.postId,
      platform: p.platform,
      postAuthor: p.author,
      reporter: req.reporter,
      reason: req.reason,
      status: 'OPEN',
      createdAt: new Date().toISOString()
    });
    save();
    return buildLocalBootstrap(db, req.reporter);
  }

  if (action === 'sendConnectionRequest') {
    const blocked = db.blocks.some(b =>
      (b.blocker.toLowerCase() === req.receiver.toLowerCase() && b.blocked.toLowerCase() === req.requester.toLowerCase()) ||
      (b.blocker.toLowerCase() === req.requester.toLowerCase() && b.blocked.toLowerCase() === req.receiver.toLowerCase())
    );
    if (blocked) return { ok: false, error: 'Blocked! Remains in Block List until removed by EnclaveAdmin.' };
    const existing = db.connections.find(c =>
      (c.requester.toLowerCase() === req.requester.toLowerCase() && c.receiver.toLowerCase() === req.receiver.toLowerCase()) ||
      (c.requester.toLowerCase() === req.receiver.toLowerCase() && c.receiver.toLowerCase() === req.requester.toLowerCase())
    );
    if (existing) {
      if (existing.status === 'DENIED') {
        existing.requester = req.requester;
        existing.receiver = req.receiver;
        existing.status = 'PENDING';
        save();
        return buildLocalBootstrap(db, req.requester);
      }
      return { ok: false, error: 'Connection already pending or accepted.' };
    }
    db.connections.push({ connId: 'CONN_' + Date.now(), requester: req.requester, receiver: req.receiver, status: 'PENDING' });
    save();
    return buildLocalBootstrap(db, req.requester);
  }

  if (action === 'respondConnectionRequest') {
    const c = db.connections.find(x => x.connId === req.connId);
    if (c) c.status = req.decision;
    save();
    return buildLocalBootstrap(db, req.username);
  }

  if (action === 'blockUser') {
    db.blocks.push({ blockId: 'BLK_' + Date.now(), blocker: req.blocker, blocked: req.blocked });
    db.connections = db.connections.filter(c => !(
      (c.requester.toLowerCase() === req.blocker.toLowerCase() && c.receiver.toLowerCase() === req.blocked.toLowerCase()) ||
      (c.requester.toLowerCase() === req.blocked.toLowerCase() && c.receiver.toLowerCase() === req.blocker.toLowerCase())
    ));
    save();
    return buildLocalBootstrap(db, req.blocker);
  }

  if (action === 'createGroup') {
    const unique = Array.from(new Set(req.members));
    if (unique.length > 5) return { ok: false, error: 'Max 5 members allowed in a group.' };
    db.groups.push({ groupId: 'GRP_' + Date.now(), groupName: req.groupName, creator: req.creator, members: unique });
    save();
    return buildLocalBootstrap(db, req.creator);
  }

  if (action === 'sendMessage') {
    db.messages.push({
      msgId: 'MSG_' + Date.now(),
      chatType: req.chatType,
      targetId: req.targetId,
      sender: req.sender,
      text: req.text || '',
      mediaUrl: req.mediaUrl || '',
      sharedPostId: req.sharedPostId || '',
      replyToMsgId: req.replyToMsgId || '',
      replyPreview: req.replyPreview || '',
      createdAt: new Date().toISOString()
    });
    save();
    return buildLocalBootstrap(db, req.sender);
  }

  if (action === 'adminAction') {
    if (req.subAction === 'TAKEDOWN_POST') {
      const p = db.posts.find(x => x.postId === req.postId);
      if (p) { p.status = 'TAKEDOWN'; p.takedownReason = req.reason; }
      db.reports.forEach(r => { if (r.postId === req.postId) r.status = 'TAKEN_DOWN'; });
    } else if (req.subAction === 'RESTORE_POST') {
      const p = db.posts.find(x => x.postId === req.postId);
      if (p) p.status = 'ACTIVE';
    } else if (req.subAction === 'IGNORE_REPORT') {
      const r = db.reports.find(x => x.reportId === req.reportId);
      if (r) r.status = 'IGNORED';
    } else if (req.subAction === 'DELETE_REPORT') {
      db.reports = db.reports.filter(x => x.reportId !== req.reportId);
    } else if (req.subAction === 'UNBLOCK_USER') {
      db.blocks = db.blocks.filter(x => x.blockId !== req.blockId);
    } else if (req.subAction === 'SET_FOLLOWERS') {
      const u = db.users.find(x => x.username.toLowerCase() === req.targetUser.toLowerCase());
      if (u) u.followers = Number(req.followers) || 0;
    }
    save();
    return buildLocalBootstrap(db, 'EnclaveAdmin');
  }

  return { ok: false, error: 'Unhandled action' };
}

function buildLocalBootstrap(db, username) {
  const reqLower = String(username || '').toLowerCase();
  const isAdmin = reqLower === 'enclaveadmin';

  const users = db.users.map(u => {
    const t = calculateTierInfo(u.followers);
    const uPosts = db.posts.filter(p => p.author.toLowerCase() === u.username.toLowerCase() && p.status === 'ACTIVE');
    const up = uPosts.reduce((s, p) => s + (p.genUpvotes || 0) + (p.manualUpvotes || 0), 0);
    const down = uPosts.reduce((s, p) => s + (p.genDownvotes || 0) + (p.manualDownvotes || 0), 0);
    return {
      ...u,
      tier: t.tier,
      multiplier: t.multiplier,
      verified: t.verified || u.isAdmin,
      tierLabel: t.label,
      totalUpvotes: up,
      totalDownvotes: down
    };
  });

  const currentUser = users.find(u => u.username.toLowerCase() === reqLower);
  const posts = db.posts.map(p => {
    const myV = db.votes.find(v => v.postId === p.postId && v.username.toLowerCase() === reqLower);
    return {
      ...p,
      upvotes: (p.genUpvotes || 0) + (p.manualUpvotes || 0),
      downvotes: (p.genDownvotes || 0) + (p.manualDownvotes || 0),
      myVote: myV ? myV.voteType : null
    };
  });

  const visibleGroups = db.groups.filter(g => g.members.some(m => m.toLowerCase() === reqLower));

  return {
    ok: true,
    currentUser,
    users,
    posts: isAdmin ? posts : posts.filter(p => p.status === 'ACTIVE' || p.author.toLowerCase() === reqLower),
    connections: db.connections,
    blocks: db.blocks,
    groups: visibleGroups,
    messages: db.messages,
    reports: isAdmin ? db.reports : [],
    history: isAdmin ? db.history : [],
    globalAdminLogo: (users.find(u => u.isAdmin) || {}).adminLogo || LOGO_CONFIG.ENCLAVE_HUB_LOGO
  };
}

/**
 * Utility Helpers
 */
function fileToDataUrl(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = e => resolve(e.target.result);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

function escapeHtml(str) {
  return String(str === undefined || str === null ? '' : str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function formatTime(iso) {
  if (!iso) return 'Just now';
  const d = new Date(iso);
  return isNaN(d.getTime()) ? String(iso) : d.toLocaleString();
}

function showToast(msg) {
  const el = document.getElementById('toastBox');
  el.textContent = msg;
  el.style.display = 'block';
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(() => { el.style.display = 'none'; }, 3600);
}
</script>
